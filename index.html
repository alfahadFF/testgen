<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCOR Master Studio - Ultimate Edition (V 8.1)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    
    @font-face { font-family: 'SCORFont'; src: url('SCOR-Typeface-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'SCORFont'; src: url('SCOR-Typeface-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'SCORFont'; src: url('SCOR-Typeface-ExtraBold.woff2') format('woff2'); font-weight: 800; font-style: normal; }
    @font-face { font-family: 'SCORFont'; src: url('SCOR-Typeface-Black.woff2') format('woff2'); font-weight: 900; font-style: normal; }

    :root { --main-font: 'SCORFont', 'Cairo', sans-serif; --base-size: 14px; }
    body { font-family: var(--main-font); background-color: #0b0c0e; color: #fff; }
    
    .canvas-container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 40px; padding-bottom: 100px; overflow-y: auto; gap: 30px; }
    .a4-page { font-family: var(--main-font); font-size: var(--base-size); width: 210mm; height: 297mm; background-color: #fff; color: #000; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.5); transform: scale(0.65); transform-origin: top center; margin-bottom: -100mm; overflow: hidden; flex-shrink: 0; background-size: cover; background-position: center; }
    .a4-page::before { content: ''; position: absolute; top: 0; bottom: 0; left: 5mm; width: 1px; border-left: 1px dashed rgba(245, 183, 0, 0.4); pointer-events: none; z-index: 1; }
    .a4-page::after { content: ''; position: absolute; top: 0; bottom: 0; right: 5mm; width: 1px; border-right: 1px dashed rgba(245, 183, 0, 0.4); pointer-events: none; z-index: 1; }

    .page-header { position: absolute; top: 0; left: 0; width: 100%; height: 35mm; background-size: 100% auto; background-position: top center; background-repeat: no-repeat; pointer-events: none; z-index: 2; }
    .is-normal-footer { position: absolute; bottom: 0; left: 0; width: 100%; height: 25mm; background-size: 100% auto; background-position: bottom center; background-repeat: no-repeat; pointer-events: none; z-index: 2; }
    .is-last-footer { position: absolute; bottom: 0; left: 0; width: 100%; height: 80mm; background-size: 100% auto; background-position: bottom center; background-repeat: no-repeat; pointer-events: none; z-index: 2; }

    .spec-block { background: #f8f9fa; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; height: 100%; }
    .spec-header { position: relative; background: #1f2937; color: #ffffff; padding: 8px 15px 8px 50px; font-weight: 900; font-size: 1.1em; border: none; clip-path: polygon(15px 0, 100% 0, 100% 100%, 0 100%); }
    .spec-header::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40px; background: #f5b700; clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%); }
    .spec-row { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid #e5e7eb; font-size: 1em; align-items: center; }
    .spec-row:last-child { border-bottom: none; }
    .spec-key { font-weight: 700; color: #374151; outline: none; }
    .spec-val { font-weight: 900; color: #000; outline: none; text-align: left; }

    .free-container { position: absolute; border: 1px dashed #ccc; background: rgba(248, 249, 250, 0.9); display: flex; flex-direction: column; z-index: 5; }
    .free-container:hover { border-color: #f5b700; box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 10; }
    .drag-bar { height: 24px; background: #282c35; color: #f5b700; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; font-size: 11px; opacity: 0; transition: opacity 0.2s; flex-shrink: 0;}
    .free-container:hover .drag-bar { opacity: 1; }
    .drag-title { flex: 1; text-align: center; cursor: grab; }
    .drag-title:active { cursor: grabbing; }

    .grid-row { display: flex; flex: 1; width: 100%; height: 100%; position: relative; }
    .grid-col { flex: 1; min-width: 20px; padding: 5px; position: relative; display: flex; flex-direction: column; }
    .col-resizer { width: 5mm; background: #e5e7eb; cursor: col-resize; display: flex; justify-content: center; align-items: center; flex-shrink: 0; z-index: 10; }
    .free-container:hover .col-resizer { background: rgba(245, 183, 0, 0.4); }
    .col-resizer:hover, .col-resizer:active { background: #f5b700; }

    .resizer { position: absolute; background: #fff; border: 1px solid #f5b700; opacity: 0; z-index: 20; box-shadow: 0 0 3px rgba(0,0,0,0.2); }
    .free-container:hover .resizer { opacity: 1; }
    .resizer.t { top: -4px; left: 50%; width: 10px; height: 8px; transform: translateX(-50%); cursor: ns-resize; }
    .resizer.b { bottom: -4px; left: 50%; width: 10px; height: 8px; transform: translateX(-50%); cursor: ns-resize; }
    .resizer.l { left: -4px; top: 50%; width: 8px; height: 10px; transform: translateY(-50%); cursor: ew-resize; }
    .resizer.r { right: -4px; top: 50%; width: 8px; height: 10px; transform: translateY(-50%); cursor: ew-resize; }
    .resizer.tl { top: -4px; left: -4px; width: 8px; height: 8px; cursor: nwse-resize; }
    .resizer.tr { top: -4px; right: -4px; width: 8px; height: 8px; cursor: nesw-resize; }
    .resizer.bl { bottom: -4px; left: -4px; width: 8px; height: 8px; cursor: nesw-resize; }
    .resizer.br { bottom: -4px; right: -4px; width: 8px; height: 8px; cursor: nwse-resize; }

    .draggable-wrapper { position: absolute; z-index: 6; border: 2px solid transparent; }
    .draggable-wrapper:hover { border: 2px dashed #f5b700; z-index: 10; }
    .draggable-wrapper img { width: 100%; height: auto; pointer-events: none; display: block; }
    .simple-resizer { width: 15px; height: 15px; background-color: #f5b700; position: absolute; bottom: -2px; left: -2px; cursor: sw-resize; opacity: 0; transition: opacity 0.2s; }
    .draggable-wrapper:hover .simple-resizer { opacity: 1; }
    .drag-handle { cursor: grab; display: inline-flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); color: white; border-radius: 4px; padding: 2px 5px; margin-left: 5px; opacity: 0; font-size: 16px; }
    .draggable-wrapper:hover .drag-handle { opacity: 1; }
    .drag-handle:active { cursor: grabbing; }

    a.contact-text, span.contact-text { text-decoration: none; outline: none; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    a.contact-text:hover { text-decoration: underline; color: #f5b700 !important; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #15171c; }
    ::-webkit-scrollbar-thumb { background: #f5b700; border-radius: 4px; }

    @media print {
      body { background: none; }
      .w-\[45\%\] { display: none !important; }
      .w-\[55\%\] { width: 100% !important; padding: 0 !important; background: none !important; overflow: visible !important; }
      .canvas-container { overflow: visible !important; height: auto !important; padding-bottom: 0 !important; }
      .a4-page { transform: scale(1) !important; margin: 0 !important; box-shadow: none !important; width: 210mm !important; height: 297mm !important; page-break-after: always; }
      .a4-page::before, .a4-page::after { display: none !important; }
      .drag-bar, .resizer, .col-resizer, .simple-resizer, .drag-handle, .no-print, .delete-btn { display: none !important; }
      .free-container, .draggable-wrapper { border: none !important; background: transparent !important; }
    }
  </style>
</head>
<body class="h-screen flex overflow-hidden">

  <!-- لوحة التحكم -->
  <div class="w-[45%] max-w-md h-full bg-[#15171c] border-l border-[#282c35] p-5 overflow-y-auto flex flex-col gap-4 shadow-2xl z-50">
    <div class="flex justify-between items-center border-b border-[#282c35] pb-2">
      <h1 class="text-2xl font-black text-[#f5b700]">SCOR Studio</h1>
      <span id="dataStatus" class="text-xs bg-gray-700 text-white px-2 py-1 rounded">جاري الاتصال...</span>
    </div>

    <!-- 0. إدارة القوالب -->
    <div class="bg-[#1f2937] p-2.5 rounded-lg border border-[#f5b700] flex gap-2">
      <button onclick="saveTemplate()" class="w-1/2 bg-[#f5b700] text-black font-bold text-xs py-2 rounded hover:brightness-110 shadow-lg">💾 حفظ كقالب افتراضي</button>
      <button onclick="loadTemplate()" class="w-1/2 bg-[#374151] text-white font-bold text-xs py-2 rounded hover:bg-[#4b5563]">📂 استرجاع القالب</button>
      <button onclick="clearTemplate()" class="w-1/6 bg-red-900 text-white font-bold text-xs py-2 rounded hover:bg-red-700" title="مسح القالب المحفوظ">🗑️</button>
    </div>

    <!-- 1. أداة الخطوط المستهدفة -->
    <div class="bg-[#0e1014] p-3 rounded-lg border border-[#343946] flex flex-col gap-2">
      <h2 class="text-[#f5b700] font-bold text-xs border-b border-[#282c35] pb-1">1. تخصيص الخطوط لكل قسم بشكل منفصل</h2>
      <select id="fontTargetSelect" class="w-full bg-[#181b22] border border-[#343946] p-1.5 rounded text-white text-xs outline-none">
        <option value=".spec-header span">عناوين الجداول (نطاق العمل، الأبعاد...)</option>
        <option value=".spec-row">نصوص وصفوف الجداول</option>
        <option value=".contact-text">بيانات التواصل (الفوتر)</option>
        <option value=".draggable-wrapper div[contenteditable]">النصوص الحرة والمنفصلة</option>
      </select>
      <div class="flex gap-2 mt-1">
        <select id="globalFontFamily" class="w-2/3 bg-[#181b22] border border-[#343946] p-1.5 rounded text-[#f5b700] text-xs font-bold outline-none">
          <option value="'SCORFont', 'Cairo', sans-serif">الخط الافتراضي (SCOR)</option>
          <option value="'Cairo', sans-serif">خط بديل (Cairo)</option>
          <option value="Arial, sans-serif">خط عادي (Arial)</option>
        </select>
        <div class="w-1/3 flex items-center bg-[#181b22] border border-[#343946] rounded px-2">
          <span class="text-[10px] text-gray-400 ml-1">حجم:</span>
          <input type="number" id="globalFontSize" value="14" min="6" max="40" class="w-full bg-transparent text-white text-xs outline-none text-center">
        </div>
      </div>
      <button onclick="applyTargetedFontSettings()" class="w-full bg-[#282c35] text-white text-[10px] font-bold py-1.5 rounded hover:bg-[#f5b700] hover:text-black transition">✓ تطبيق الخط على القسم المحدد</button>
    </div>

    <!-- 2. إعدادات المستند والخلفيات -->
    <div class="bg-[#0e1014] p-3 rounded-lg border border-[#282c35] flex flex-col gap-2">
      <h2 class="text-[#f5b700] font-bold text-xs border-b border-[#282c35] pb-1">2. إعدادات المستند والهيكل</h2>
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-gray-300">تضمين غلاف أمامي (Cover):</label>
        <input type="checkbox" id="hasCover" class="w-4 h-4 accent-[#f5b700]" onchange="renderPages()">
      </div>
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-gray-300">عدد الصفحات الداخلية:</label>
        <input type="number" id="pageCount" min="1" max="20" value="2" class="w-14 bg-[#181b22] border border-[#343946] p-1 rounded text-white text-center text-xs" onchange="renderPages()">
      </div>
      <div class="mt-1 pt-1 border-t border-[#282c35]">
        <label class="block text-[10px] font-bold text-gray-400 mb-1">تخصيص خلفية لصفحة محددة:</label>
        <div class="flex gap-2">
          <select id="customBgPage" class="w-1/3 bg-[#181b22] border border-[#343946] p-1 rounded text-white text-xs"></select>
          <input type="file" id="customBgUpload" accept="image/*" class="w-2/3 text-[10px] text-gray-400 bg-[#181b22] rounded p-1">
        </div>
      </div>
    </div>

    <!-- 3. الهوية البصرية -->
    <div class="bg-[#0e1014] p-3 rounded-lg border border-[#282c35] flex flex-col gap-2">
      <h2 class="text-[#f5b700] font-bold text-xs border-b border-[#282c35] pb-1">3. الترويسات والتذييلات</h2>
      <div class="flex gap-2">
        <div class="w-1/2">
          <label class="block text-[10px] font-bold text-gray-400">الترويسة (Header):</label>
          <input type="file" id="globalHeader" accept="image/*" class="w-full text-[10px] text-gray-400 bg-[#181b22] rounded p-1 mt-1">
        </div>
        <div class="w-1/2">
          <label class="block text-[10px] font-bold text-gray-400">التذييل (Footer العادي):</label>
          <input type="file" id="globalFooter" accept="image/*" class="w-full text-[10px] text-gray-400 bg-[#181b22] rounded p-1 mt-1">
        </div>
      </div>
      <div class="mt-1 pt-1 border-t border-[#282c35]">
        <label class="block text-[10px] font-bold text-[#f5b700] mb-1">تذييل الصفحة الأخيرة فقط:</label>
        <input type="file" id="lastFooter" accept="image/*" class="w-full text-[10px] text-[#f5b700] bg-[#181b22] border border-[#f5b700] rounded p-1">
      </div>
    </div>

    <!-- 4. محرك الجداول الذكي -->
    <div class="bg-[#0e1014] p-3 rounded-lg border border-[#343946] flex flex-col gap-2 relative">
      <h2 class="text-white font-bold text-xs border-b border-[#282c35] pb-1">4. إدراج الجداول المركزية (متصل بـ Sheets)</h2>
      
      <div class="flex gap-2 mt-1">
          <div class="w-1/2">
              <label class="text-[10px] font-bold text-[#f5b700]">1. الفئة:</label>
              <select id="sheetCategory" class="w-full bg-[#181b22] border border-[#343946] p-1.5 rounded text-white text-xs outline-none" onchange="updateModelsList()">
                <option value="skid_steers">معدات انزلاقية</option>
                <option value="pumps">مضخات بيتون</option>
              </select>
          </div>
          <div class="w-1/2">
              <label class="text-[10px] font-bold text-[#f5b700]">2. الموديل:</label>
              <select id="modelSelector" class="w-full bg-[#181b22] border border-[#343946] p-1.5 rounded text-white text-xs outline-none">
                  <option value="">جاري التحميل...</option>
              </select>
          </div>
      </div>

      <label class="text-[10px] font-bold text-gray-400 mt-1">3. ماذا تريد أن تدرج للموديل المحدد؟</label>
      <select id="dataSourceSelect" class="w-full bg-[#181b22] border border-[#343946] p-1.5 rounded text-white text-xs outline-none">
        <optgroup label="نصوص حرة (للعناوين والترويسات)">
            <option value="text:marketing_slogan">العبارة التسويقية (نص)</option>
            <option value="text:short_description">الوصف المختصر (نص)</option>
            <option value="text:marketing_description">الوصف التسويقي (نص - للمضخات)</option>
        </optgroup>
        <optgroup label="جداول المواصفات الفنية">
            <option value="table:engine">جدول المحرك</option>
            <option value="table:hydraulic">جدول النظام الهيدروليكي</option>
            <option value="table:drive">جدول نظام الدفع</option>
            <option value="table:performance">جدول الأداء ونطاق العمل</option>
            <option value="table:weights">جدول الأوزان والسعات</option>
            <option value="table:equipment">جدول التجهيزات</option>
            <option value="table:dimensions">جدول الأبعاد</option>
        </optgroup>
      </select>
      
      <input type="text" id="sectionTitle" placeholder="عنوان الجدول (اختياري - مثلاً: المحرك)" class="w-full bg-[#181b22] border border-[#343946] p-1.5 rounded text-white text-xs font-bold focus:border-[#f5b700] outline-none mt-1">

      <button onclick="insertDynamicData(event)" id="insertDataBtn" disabled class="w-full bg-[#343946] text-white text-xs font-bold py-2 mt-1 rounded hover:bg-[#f5b700] hover:text-black transition flex items-center justify-center gap-2">
        <span>إدراج البيانات للموديل المختار ↓</span>
      </button>
    </div>

    <!-- 5. محرك تخطيط الحاويات -->
    <div class="bg-[#0e1014] p-3 rounded-lg border border-[#f5b700] flex flex-col gap-3">
      <h2 class="text-[#f5b700] font-bold text-xs border-b border-[#282c35] pb-1">5. بناء الشبكة والحاويات الفارغة</h2>
      <div class="flex gap-2 items-center">
        <label class="text-xs font-bold text-gray-400 w-1/3">العمليات على صفحة:</label>
        <select id="targetPageSelect" class="w-2/3 bg-[#181b22] border border-[#f5b700] p-1 rounded text-[#f5b700] font-bold text-xs outline-none"></select>
      </div>
      <div class="grid grid-cols-5 gap-1">
        <button onclick="addFloatingContainer(1)" class="bg-[#282c35] text-white text-[10px] font-bold py-1.5 rounded hover:bg-[#f5b700] hover:text-black">1 عمود</button>
        <button onclick="addFloatingContainer(2)" class="bg-[#282c35] text-white text-[10px] font-bold py-1.5 rounded hover:bg-[#f5b700] hover:text-black">2 عمود</button>
        <button onclick="addFloatingContainer(3)" class="bg-[#282c35] text-white text-[10px] font-bold py-1.5 rounded hover:bg-[#f5b700] hover:text-black">3 أعمدة</button>
        <button onclick="addFloatingContainer(4)" class="bg-[#282c35] text-white text-[10px] font-bold py-1.5 rounded hover:bg-[#f5b700] hover:text-black">4 أعمدة</button>
        <button onclick="addFloatingContainer(5)" class="bg-[#282c35] text-white text-[10px] font-bold py-1.5 rounded hover:bg-[#f5b700] hover:text-black">5 أعمدة</button>
      </div>
      <div class="flex gap-2 mt-1 pt-2 border-t border-[#282c35]">
        <button onclick="addFreeText()" class="w-1/2 bg-[#181b22] text-[#f5b700] border border-[#f5b700] text-xs font-bold py-1.5 rounded hover:bg-[#f5b700] hover:text-black">+ نص فارغ</button>
        <label class="w-1/2 bg-[#181b22] text-[#f5b700] border border-[#f5b700] text-center text-xs font-bold py-1.5 rounded cursor-pointer hover:bg-[#f5b700] hover:text-black">
          + صورة حرة
          <input type="file" id="freeImageUpload" accept="image/*" class="hidden">
        </label>
      </div>
    </div>

    <!-- 6. بيانات التواصل التفاعلية -->
    <div class="bg-[#0e1014] p-3 rounded-lg border border-[#f5b700] flex flex-col gap-2">
      <h2 class="text-[#f5b700] font-bold text-xs border-b border-[#282c35] pb-1">6. إدراج بيانات التواصل (تفاعلية للـ PDF)</h2>
      <select id="contactPresetSelect" class="w-full bg-[#181b22] border border-[#343946] p-1.5 rounded text-white text-xs outline-none focus:border-[#f5b700]">
        <option value="4915118316638" data-type="phone">004915118316638</option>
        <option value="4917634389434" data-type="phone">004917634389434</option>
        <option value="963939062887" data-type="phone">00963939062887</option>
        <option value="963941435541" data-type="phone">00963941435541</option>
        <option value="https://www.scor-sy.de" data-type="web">www.scor-sy.de</option>
        <option value="mailto:info@scor-sy.de" data-type="web">info@scor-sy.de</option>
      </select>
      <button onclick="addContactBlock()" class="w-full bg-[#f5b700] text-black text-xs font-bold py-2 rounded hover:brightness-110 transition mt-1">
        + إدراج الرابط التفاعلي
      </button>
    </div>

    <button onclick="window.print()" class="w-full bg-white text-black font-black py-3 rounded-lg mt-auto hover:bg-gray-200 border-2 border-black">
      طباعة / تصدير KTLG النهائي (PDF)
    </button>
  </div>

  <!-- مساحة العمل الحية -->
  <div class="w-[55%] h-full bg-[#181b22] canvas-container" id="pagesContainer"></div>

<script>
  // ==========================================
  // محرك الربط بقاعدة بيانات Google Sheets
  // ==========================================
  const SHEETS_ID = "1TDSSCDfAQJxz_zeulBrM6M79p9fw7mE1xTSvD-P_fuQ";
  let database = { skid_steers: [], pumps: [] };
  
  const translationDict = {
    'model_name': 'الاسم', 'marketing_slogan': 'العبارة التسويقية', 'short_description': 'الوصف المختصر', 'sub_type': 'النوع الفرعي', 'marketing_description': 'الوصف التسويقي', 'general_model': 'الموديل', 'equipment_type': 'نوع المعدة', 'general_design': 'التصميم', 'operating_system': 'نظام التشغيل', 'general_usage': 'الاستخدام',

  async function fetchSheetData() {
      const statusBadge = document.getElementById('dataStatus');
      try {
          const skidUrl = `https://docs.google.com/spreadsheets/d/tq?tqx=out:csv&key=${SHEETS_ID}&gid=546876457`;
          const pumpUrl = `https://docs.google.com/spreadsheets/d/tq?tqx=out:csv&key=${SHEETS_ID}&gid=1201691755`;
          
          await Promise.all([
            new Promise((resolve, reject) => Papa.parse(skidUrl, { download: true, header: true, complete: res => { database.skid_steers = res.data; resolve(); }, error: err => reject(err)})),
            new Promise((resolve, reject) => Papa.parse(pumpUrl, { download: true, header: true, complete: res => { database.pumps = res.data; resolve(); }, error: err => reject(err)}))
          ]);
          
          statusBadge.innerHTML = 'متصل بالبيانات 🟢';
          statusBadge.className = 'text-xs bg-green-700 text-white px-2 py-1 rounded';
          document.getElementById('insertDataBtn').disabled = false;
          updateModelsList();
      } catch (error) {
          statusBadge.innerHTML = 'خطأ بالاتصال 🔴';
          statusBadge.className = 'text-xs bg-red-700 text-white px-2 py-1 rounded';
      }
  }

  function updateModelsList() {
      const category = document.getElementById('sheetCategory').value;
      const modelSelector = document.getElementById('modelSelector');
      modelSelector.innerHTML = '';
      
      const models = database[category];
      if(!models || models.length === 0) {
          modelSelector.innerHTML = '<option value="">لا يوجد موديلات</option>';
          return;
      }
      
      models.forEach((row, index) => {
          if(row.model_name && row.model_name.trim() !== '') {
              const opt = document.createElement('option');
              opt.value = index; 
              opt.text = row.model_name;
              modelSelector.appendChild(opt);
          }
      });
  }

  function insertDynamicData(e) {
      const btn = e.currentTarget;
      const category = document.getElementById('sheetCategory').value;
      const modelIndex = document.getElementById('modelSelector').value;
      const requestType = document.getElementById('dataSourceSelect').value;
      let title = document.getElementById('sectionTitle').value;
      
      const targetPageVal = document.getElementById('targetPageSelect').value;
      const targetPage = document.getElementById(`page-${targetPageVal}`);
      
      if(!targetPage || modelIndex === "") return;
      
      const rowData = database[category][modelIndex];
      const typeParts = requestType.split(':');
      const action = typeParts[0]; 
      const key = typeParts[1];

      if (action === 'text') {
          const textValue = rowData[key] || '';
          if(textValue.trim() === '') { alert('هذا الحقل فارغ في قاعدة البيانات لهذا الموديل!'); return; }
          
          const wrapper = document.createElement('div'); 
          wrapper.className = 'draggable-wrapper flex items-start gap-1 p-2';
          wrapper.style.top = '50mm'; wrapper.style.left = '5mm'; wrapper.style.width = 'max-content';

          const dragHandle = document.createElement('div'); dragHandle.innerHTML = '☩'; dragHandle.className = 'drag-handle no-print absolute -left-6 top-1/2 transform -translate-y-1/2'; wrapper.appendChild(dragHandle);
          
          const editableText = document.createElement('div'); editableText.contentEditable = true; editableText.innerText = textValue; 
          editableText.className = 'outline-none text-[#f5b700] font-black text-2xl bg-transparent w-full whitespace-nowrap'; wrapper.appendChild(editableText);
          
          const resizer = document.createElement('div'); resizer.className = 'simple-resizer no-print'; wrapper.appendChild(resizer);

          const deleteBtn = document.createElement('button'); deleteBtn.innerHTML = '✖';
          deleteBtn.className = 'delete-btn no-print absolute -top-2 -right-2 bg-white border border-red-500 text-red-500 rounded-full w-5 h-5 flex items-center justify-center text-[10px] cursor-pointer z-50 hover:bg-red-500 hover:text-white';
          deleteBtn.setAttribute('onclick', "this.closest('.draggable-wrapper').remove()");
          wrapper.appendChild(deleteBtn);
          
          targetPage.appendChild(wrapper);
          makeBoundedDraggable(wrapper, dragHandle, targetPage);
          makeSimpleResizable(wrapper, resizer, targetPage); 
      } 
      else if (action === 'table') {
          const colsToInclude = tableGroups[key];
          let tableData = [];
          
          colsToInclude.forEach(colKey => {
              if(rowData[colKey] && rowData[colKey].trim() !== '') {
                  tableData.push({ k: translationDict[colKey] || colKey, v: rowData[colKey] });
              }
          });

          if(tableData.length === 0) { alert('لا توجد بيانات متوفرة لهذا الجدول في الموديل المحدد.'); return; }
          if(!title) title = document.querySelector(`#dataSourceSelect option[value="${requestType}"]`).text;

          const container = document.createElement('div');
          container.className = 'free-container';
          container.style.width = '100mm'; container.style.height = 'auto'; container.style.minHeight = '30mm'; 
          container.style.top = '100mm'; container.style.left = '5mm'; container.style.padding = '0'; 
          container.style.background = 'transparent'; container.style.border = '1px dashed transparent'; 

          const dragBar = document.createElement('div');
          dragBar.className = 'drag-bar no-print';
          dragBar.innerHTML = `<div style="width:20px;"></div><span class="drag-title">☩ سحب وتغيير مقاس الجدول</span><button onclick="this.closest('.free-container').remove()" class="text-red-500 hover:text-red-300 font-bold text-sm bg-transparent border-none">✖</button>`;
          container.appendChild(dragBar);

          const block = document.createElement('div'); block.className = 'spec-block flex-1';
          const header = document.createElement('div'); header.className = 'spec-header'; 
          header.innerHTML = `<span style="position:relative; z-index:2;">${title}</span>`; 
          block.appendChild(header);

          const rowsWrapper = document.createElement('div');
          rowsWrapper.className = 'flex-1 overflow-hidden flex flex-col bg-white';
          tableData.forEach(item => {
            const rowDiv = document.createElement('div'); rowDiv.className = 'spec-row flex-1';
            rowDiv.innerHTML = `<span class="spec-key" contenteditable="true">${item.k}</span><span class="spec-val" contenteditable="true">${item.v}</span>`;
            rowsWrapper.appendChild(rowDiv);
          });
          block.appendChild(rowsWrapper);
          container.appendChild(block);

          const handlePositions = ['t', 'b', 'l', 'r', 'tl', 'tr', 'bl', 'br'];
          handlePositions.forEach(pos => {
            const handle = document.createElement('div'); handle.className = `resizer ${pos}`; container.appendChild(handle);
          });

          targetPage.appendChild(container);
          makeBoundedDraggable(container, dragBar, targetPage);
          makeBoundedBoxResizable(container, targetPage);
      }
      
      document.getElementById('sectionTitle').value = '';
  }

  function applyTargetedFontSettings() {
    const targetSel = document.getElementById('fontTargetSelect').value;
    const fontFamily = document.getElementById('globalFontFamily').value;
    const fontSize = document.getElementById('globalFontSize').value + 'px';
    dynamicStyles[targetSel] = `{ font-family: ${fontFamily} !important; font-size: ${fontSize} !important; }`;

  function updateDynamicStyles() {
    let styleTag = document.getElementById('dynamic-typography');
    if(!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'dynamic-typography';
        document.head.appendChild(styleTag);
    }
    let css = '';
    for(let sel in dynamicStyles) { css += `${sel} ${dynamicStyles[sel]}\n`; }
    styleTag.innerHTML = css;

  function saveTemplate() {
    const pagesHTML = document.getElementById('pagesContainer').innerHTML;
    const templateData = { 
        pages: pagesHTML, state: state, styles: dynamicStyles,
        pageCount: document.getElementById('pageCount').value, hasCover: document.getElementById('hasCover').checked
    };
    localStorage.setItem('scor_master_template', JSON.stringify(templateData));
    alert('تم حفظ ترتيب وتنسيق الصفحات كقالب بنجاح!');
  }

  function loadTemplate() {
    const dataStr = localStorage.getItem('scor_master_template');
    if(!dataStr) { alert('لا يوجد قالب محفوظ مسبقاً!'); return; }
    const templateData = JSON.parse(dataStr);
    document.getElementById('pageCount').value = templateData.pageCount;
    document.getElementById('hasCover').checked = templateData.hasCover;
    state = templateData.state;
    dynamicStyles = templateData.styles || {};
    document.getElementById('pagesContainer').innerHTML = templateData.pages;
    updateHeadersAndFooters();
    updateDynamicStyles();
    updateDropdowns(document.getElementById('customBgPage'), document.getElementById('targetPageSelect'), templateData.hasCover, templateData.pageCount);
    reAttachAllEvents();
    alert('تم استرجاع القالب بنجاح!');
  }

  function clearTemplate() {
      if(confirm('هل أنت متأكد من مسح القالب المحفوظ؟')) localStorage.removeItem('scor_master_template');
  }

  function reAttachAllEvents() {
    document.querySelectorAll('.free-container').forEach(container => {
       const dragBar = container.querySelector('.drag-bar');
       const page = container.closest('.a4-page');
       if(dragBar && page) makeBoundedDraggable(container, dragBar, page);
       makeBoundedBoxResizable(container, page);
       const row = container.querySelector('.grid-row');
       if(row) {
           container.querySelectorAll('.col-resizer').forEach(gutter => {
               const leftCol = gutter.previousElementSibling;
               if(leftCol) makeColResizable(leftCol, gutter, row);
           });
       }
    });
    document.querySelectorAll('.draggable-wrapper').forEach(wrapper => {
       const page = wrapper.closest('.a4-page');
       const dragHandle = wrapper.querySelector('.drag-handle') || wrapper;
       if(page) makeBoundedDraggable(wrapper, dragHandle, page);
       const simpleResizer = wrapper.querySelector('.simple-resizer');
       if(simpleResizer && page) makeSimpleResizable(wrapper, simpleResizer, page);
    });
  }

  function renderPages() {
    const container = document.getElementById('pagesContainer');
    const customBgSelect = document.getElementById('customBgPage');
    const targetSelect = document.getElementById('targetPageSelect');
    const hasCover = document.getElementById('hasCover').checked;
    const pageCount = parseInt(document.getElementById('pageCount').value) || 1;
    if(container.innerHTML === '') { buildPagesDOM(container, customBgSelect, targetSelect, hasCover, pageCount); } 
    else { updateDropdowns(customBgSelect, targetSelect, hasCover, pageCount); }
  }

  function buildPagesDOM(container, s1, s2, hasCover, pageCount) {
    container.innerHTML = ''; s1.innerHTML = ''; s2.innerHTML = ''; 
    if (hasCover) {
      container.appendChild(createPageElement('cover'));
      s1.add(new Option('الغلاف', 'cover')); s2.add(new Option('الغلاف', 'cover'));
    }
    for (let i = 1; i <= pageCount; i++) {
      const isLast = (i === pageCount);
      container.appendChild(createPageElement(i, isLast));
      s1.add(new Option(`صفحة ${i}`, i)); s2.add(new Option(`صفحة ${i}`, i));
    }
  }

  function updateDropdowns(s1, s2, hasCover, pageCount) {
     s1.innerHTML = ''; s2.innerHTML = '';
     if (hasCover) { s1.add(new Option('الغلاف', 'cover')); s2.add(new Option('الغلاف', 'cover')); }
     for (let i = 1; i <= pageCount; i++) { s1.add(new Option(`صفحة ${i}`, i)); s2.add(new Option(`صفحة ${i}`, i)); }
  }

  function createPageElement(pageNum, isLast = false) {
    const page = document.createElement('div');
    page.className = 'a4-page'; page.id = `page-${pageNum}`;
    const watermark = document.createElement('div');
    watermark.className = 'no-print';
    watermark.innerHTML = pageNum === 'cover' ? 'الغلاف (Cover)' : `صفحة ${pageNum}`;
    watermark.style = "position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#e5e7eb; font-size:40px; font-weight:900; z-index:0; opacity: 0.2;";
    page.appendChild(watermark);
    if (pageNum !== 'cover') {
      const header = document.createElement('div'); header.className = 'page-header'; page.appendChild(header);
      const footer = document.createElement('div'); footer.className = isLast ? 'is-last-footer' : 'is-normal-footer'; page.appendChild(footer);
    }
    return page;
  }

  document.getElementById('globalHeader').addEventListener('change', (e) => uploadImage(e, 'headerImg'));
  document.getElementById('globalFooter').addEventListener('change', (e) => uploadImage(e, 'footerImg'));
  document.getElementById('lastFooter').addEventListener('change', (e) => uploadImage(e, 'lastFooterImg'));
  
  function uploadImage(event, stateKey) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) { state[stateKey] = e.target.result; updateHeadersAndFooters(); }
      reader.readAsDataURL(file);
    }
  }

  function updateHeadersAndFooters() {
    document.querySelectorAll('.page-header').forEach(el => { if(state.headerImg) el.style.backgroundImage = `url(${state.headerImg})`; });
    document.querySelectorAll('.is-normal-footer').forEach(el => { if(state.footerImg) el.style.backgroundImage = `url(${state.footerImg})`; });
    document.querySelectorAll('.is-last-footer').forEach(el => {
      if(state.lastFooterImg) { el.style.backgroundImage = `url(${state.lastFooterImg})`; } 
      else if (state.footerImg) { el.style.backgroundImage = `url(${state.footerImg})`; }
    });
  }

  function loadGridImage(input) {

    if (file) {

      reader.onload = e => { input.closest('.grid-col').innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover; pointer-events:none;">`; }
      reader.readAsDataURL(file);
    }
  }

  document.getElementById('freeImageUpload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const targetPageVal = document.getElementById('targetPageSelect').value;
    const targetPage = document.getElementById(`page-${targetPageVal}`);

      const reader = new FileReader();

        const wrapper = document.createElement('div'); wrapper.className = 'draggable-wrapper cursor-grab';
        wrapper.style.width = '100mm'; wrapper.style.top = '100mm'; wrapper.style.left = '5mm';
        const img = document.createElement('img'); img.src = event.target.result; wrapper.appendChild(img);
        const resizer = document.createElement('div'); resizer.className = 'simple-resizer no-print'; wrapper.appendChild(resizer);
        const deleteBtn = document.createElement('button'); deleteBtn.innerHTML = '✖';
        deleteBtn.className = 'delete-btn no-print absolute -top-3 -right-3 bg-white border border-red-500 text-red-500 rounded-full w-6 h-6 flex items-center justify-center text-xs cursor-pointer z-50 hover:bg-red-500 hover:text-white';
        deleteBtn.setAttribute('onclick', "this.closest('.draggable-wrapper').remove()");
        wrapper.appendChild(deleteBtn);
        targetPage.appendChild(wrapper);
        makeBoundedDraggable(wrapper, wrapper, targetPage); makeSimpleResizable(wrapper, resizer, targetPage);
        document.getElementById('freeImageUpload').value = '';
      }
      reader.readAsDataURL(file);
    }
  });

  function addFreeText() {
    const targetPageVal = document.getElementById('targetPageSelect').value;
    const targetPage = document.getElementById(`page-${targetPageVal}`);

    const dragHandle = document.createElement('div'); dragHandle.innerHTML = '☩'; dragHandle.className = 'drag-handle no-print absolute -left-6 top-1/2 transform -translate-y-1/2'; wrapper.appendChild(dragHandle);
    
    const editableText = document.createElement('div'); editableText.contentEditable = true; editableText.innerText = "عنوان حر"; 
    editableText.className = 'outline-none text-[#f5b700] font-black text-2xl bg-transparent w-full whitespace-nowrap'; wrapper.appendChild(editableText);
    
    const resizer = document.createElement('div'); resizer.className = 'simple-resizer no-print'; wrapper.appendChild(resizer);

    const deleteBtn = document.createElement('button'); deleteBtn.innerHTML = '✖';

    deleteBtn.setAttribute('onclick', "this.closest('.draggable-wrapper').remove()");
    wrapper.appendChild(deleteBtn);
    
    targetPage.appendChild(wrapper);
    makeBoundedDraggable(wrapper, dragHandle, targetPage);
    makeSimpleResizable(wrapper, resizer, targetPage); 
  }

  function addContactBlock() {

    const presetSelect = document.getElementById('contactPresetSelect');

    const textVal = selectedOpt.text; 
    const linkVal = selectedOpt.value;
    const isPhone = selectedOpt.getAttribute('data-type') === 'phone';

    const wrapper = document.createElement('div'); 
    wrapper.className = 'draggable-wrapper flex items-center justify-center p-1';
    wrapper.style.top = '275mm'; wrapper.style.left = '50mm';
    wrapper.style.width = 'max-content'; 
    
    const contentDiv = document.createElement('div');
    contentDiv.className = 'flex items-center gap-2 justify-center whitespace-nowrap';

    if (isPhone) {
      const waLink = document.createElement('a');
      waLink.href = 'https://wa.me/' + linkVal;
      waLink.target = '_blank';
      waLink.className = 'outline-none hover:opacity-80 transition flex items-center justify-center';
      waLink.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>`;

      const callLink = document.createElement('a');
      callLink.href = 'tel:+' + linkVal;
      callLink.target = '_blank';
      callLink.className = 'outline-none hover:opacity-80 transition flex items-center justify-center';
      callLink.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="#ef4444"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>`;

      const numText = document.createElement('span');
      numText.className = 'contact-text font-bold outline-none text-[#ffffff] whitespace-nowrap';
      numText.style.textShadow = '0px 1px 2px rgba(0,0,0,0.5)';
      numText.contentEditable = true;
      numText.innerText = textVal;

      contentDiv.appendChild(waLink);
      contentDiv.appendChild(callLink);
      contentDiv.appendChild(numText);
    } else {
      const aTag = document.createElement('a'); 
      aTag.href = linkVal; aTag.target = '_blank';
      aTag.style.color = '#ffffff'; aTag.style.textShadow = '0px 1px 2px rgba(0,0,0,0.5)';
      aTag.className = 'contact-text font-bold outline-none hover:text-[#f5b700] transition block w-full text-center whitespace-nowrap';
      aTag.contentEditable = true; aTag.innerText = textVal;
      contentDiv.appendChild(aTag);
    }

    wrapper.appendChild(contentDiv);

    const resizer = document.createElement('div'); 
    resizer.className = 'simple-resizer no-print'; 
    wrapper.appendChild(resizer);

    const dragHandle = document.createElement('div'); dragHandle.innerHTML = '☩'; dragHandle.className = 'drag-handle no-print absolute -left-6 top-1/2 transform -translate-y-1/2'; wrapper.appendChild(dragHandle);
    const deleteBtn = document.createElement('button'); deleteBtn.innerHTML = '✖';
    deleteBtn.className = 'delete-btn no-print absolute -top-3 -right-3 bg-white border border-red-500 text-red-500 rounded-full w-5 h-5 flex items-center justify-center text-[10px] cursor-pointer z-50 hover:bg-red-500 hover:text-white';

    wrapper.appendChild(deleteBtn);

    targetPage.appendChild(wrapper);
    makeBoundedDraggable(wrapper, dragHandle, targetPage);
    makeSimpleResizable(wrapper, resizer, targetPage); 
  }

  function makeSimpleResizable(wrapper, resizer, page) {
    let isResizing = false, startX, startWidth, startLeft;
    resizer.addEventListener('mousedown', function(e) { 
      e.preventDefault(); e.stopPropagation(); isResizing = true; 
      startX = e.clientX; startWidth = wrapper.offsetWidth; startLeft = wrapper.offsetLeft;
      document.addEventListener('mousemove', resize); document.addEventListener('mouseup', stopResize); 
    });
    function resize(e) { 
      if (!isResizing) return; 
      let dx = (startX - e.clientX) / scale; let newLeft = startLeft + dx;
      if (newLeft < marginPx) { dx += (marginPx - newLeft); newLeft = marginPx; }
      const newWidth = startWidth + dx;
      if (newWidth > 15) { wrapper.style.width = `${newWidth}px`; wrapper.style.left = `${newLeft}px`; }
    }
    function stopResize() { isResizing = false; document.removeEventListener('mousemove', resize); document.removeEventListener('mouseup', stopResize); }
  }

  function makeBoundedDraggable(element, handle, page) {
    let isDragging = false, startX, startY, initialLeft, initialTop;
    handle.addEventListener('mousedown', function(e) {
      if(e.target.tagName === 'BUTTON') return; 
      e.preventDefault(); e.stopPropagation(); isDragging = true; startX = e.clientX; startY = e.clientY;
      initialLeft = element.offsetLeft; initialTop = element.offsetTop;
      document.addEventListener('mousemove', drag); document.addEventListener('mouseup', dragEnd);
    });
    function drag(e) {
      if (!isDragging) return;
      const dx = (e.clientX - startX) / scale; const dy = (e.clientY - startY) / scale;
      let newLeft = initialLeft + dx; const maxLeft = page.clientWidth - marginPx - element.offsetWidth;
      newLeft = Math.max(marginPx, Math.min(newLeft, maxLeft));
      element.style.left = `${newLeft}px`; element.style.top = `${initialTop + dy}px`;
    }
    function dragEnd() { isDragging = false; document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', dragEnd); }
  }

  function makeBoundedBoxResizable(element, page) {
    const resizers = element.querySelectorAll('.resizer');
    resizers.forEach(resizer => {
      resizer.addEventListener('mousedown', function(e) {
        e.preventDefault(); e.stopPropagation();
        let isResizing = true, startX = e.clientX, startY = e.clientY, startW = element.offsetWidth, startH = element.offsetHeight, startLeft = element.offsetLeft, startTop = element.offsetTop;
        function resize(e) {
          if (!isResizing) return;
          let dx = (e.clientX - startX) / scale; let dy = (e.clientY - startY) / scale;
          if (resizer.classList.contains('r') || resizer.classList.contains('tr') || resizer.classList.contains('br')) {
            const maxW = page.clientWidth - marginPx - startLeft; element.style.width = Math.min(maxW, Math.max(30, startW + dx)) + 'px';
          }
          if (resizer.classList.contains('l') || resizer.classList.contains('tl') || resizer.classList.contains('bl')) {
            let newLeft = startLeft + dx;
            if (newLeft < marginPx) { const diff = marginPx - newLeft; newLeft = marginPx; dx += diff; }
            const newWidth = startW - dx;
            if (newWidth > 30) { element.style.width = newWidth + 'px'; element.style.left = newLeft + 'px'; }
          }
          if (resizer.classList.contains('b') || resizer.classList.contains('bl') || resizer.classList.contains('br')) { element.style.height = Math.max(20, startH + dy) + 'px'; }
          if (resizer.classList.contains('t') || resizer.classList.contains('tl') || resizer.classList.contains('tr')) {
            const newHeight = Math.max(20, startH - dy);
            if (newHeight > 20) { element.style.height = newHeight + 'px'; element.style.top = (startTop + dy) + 'px'; }
          }
        }
        function stopResize() { isResizing = false; document.removeEventListener('mousemove', resize); document.removeEventListener('mouseup', stopResize); }
        document.addEventListener('mousemove', resize); document.addEventListener('mouseup', stopResize);
      });
    });
  }

  function makeColResizable(leftCol, gutter, row) {
    let isResizingCol = false;
    gutter.addEventListener('mousedown', function(e) { e.preventDefault(); e.stopPropagation(); isResizingCol = true; document.body.style.cursor = 'col-resize'; });
    document.addEventListener('mousemove', function(e) {
      if (!isResizingCol) return;
      const rowRect = row.getBoundingClientRect(); const mouseXFromRight = rowRect.right - e.clientX;
      const percentage = (mouseXFromRight / rowRect.width) * 100;
      if (percentage > 5 && percentage < 95) leftCol.style.flex = `0 0 ${percentage}%`;
    });
    document.addEventListener('mouseup', function() { if (isResizingCol) { isResizingCol = false; document.body.style.cursor = 'default'; } });
  }

  window.onload = function() {
      renderPages();
      fetchSheetData();
  };
</script>
