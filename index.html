<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCOR Master Studio - Ultimate Edition (V 9.4 - Tables Fix)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap');
    
    @font-face { font-family: 'SCORFont'; src: url('SCOR-Typeface-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'SCORFont'; src: url('SCOR-Typeface-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'SCORFont'; src: url('SCOR-Typeface-ExtraBold.woff2') format('woff2'); font-weight: 800; font-style: normal; }
    @font-face { font-family: 'SCORFont'; src: url('SCOR-Typeface-Black.woff2') format('woff2'); font-weight: 900; font-style: normal; }

    :root { --main-font: 'SCORFont', 'Cairo', sans-serif; --base-size: 14px; }
    body { font-family: var(--main-font); background-color: #0b0c0e; color: #fff; }
    
    .canvas-container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 40px; padding-bottom: 100px; overflow-y: auto; gap: 30px; }
    .a4-page { font-family: var(--main-font); font-size: var(--base-size); width: 210mm; height: 297mm; background-color: #fff; color: #000; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.5); transform: scale(0.65); transform-origin: top center; margin-bottom: -100mm; overflow: hidden; flex-shrink: 0; background-size: cover; background-position: center; }
    .a4-page::before { content: ''; position: absolute; top: 0; bottom: 0; left: 5mm; width: 1px; border-left: 1px dashed rgba(245, 183, 0, 0.4); pointer-events: none; z-index: 1; }
    .a4-page::after { content: ''; position: absolute; top: 0; bottom: 0; right: 5mm; width: 1px; border-right: 1px dashed rgba(245, 183, 0, 0.4); pointer-events: none; z-index: 1; }

    .page-header { position: absolute; top: 0; left: 0; width: 100%; height: 35mm; background-size: 100% auto; background-position: top center; background-repeat: no-repeat; pointer-events: none; z-index: 2; }
    .is-normal-footer { position: absolute; bottom: 0; left: 0; width: 100%; height: 25mm; background-size: 100% auto; background-position: bottom center; background-repeat: no-repeat; pointer-events: none; z-index: 2; }
    .is-last-footer { position: absolute; bottom: 0; left: 0; width: 100%; height: 80mm; background-size: 100% auto; background-position: bottom center; background-repeat: no-repeat; pointer-events: none; z-index: 2; }

    /* Tables & Zebra Striping */
    .spec-block { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; height: 100%; position: relative; }
    .spec-header { position: relative; background: #1f2937; color: #ffffff; padding: 8px 15px 8px 50px; font-weight: 900; font-size: 1.1em; border: none; clip-path: polygon(15px 0, 100% 0, 100% 100%, 0 100%); z-index: 2; }
    .spec-header::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40px; background: #f5b700; clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%); }
    
    .table-rows-wrapper { display: flex; flex-direction: column; background-color: #fff; flex: 1; font-size: 14px; color: #111827; }
    .spec-row { display: flex; justify-content: space-between; padding: 6px 12px; font-size: inherit; align-items: center; border-bottom: 1px solid #e5e7eb; }
    
    /* التلوين الإجباري للصفوف (Zebra) مع لون أكثر وضوحاً */
    .table-rows-wrapper > .spec-row:nth-child(even) { background-color: #f0f2f5 !important; }
    .table-rows-wrapper > .spec-row:nth-child(odd) { background-color: #ffffff !important; }
    .table-rows-wrapper > .spec-row:last-child { border-bottom: none; }
    
    /* جعل ألوان بنود الجدول تعتمد على وراثة الخصائص من شريط الأدوات */
    .spec-key { font-weight: 700; color: inherit; outline: none; width: var(--key-width, 50%); flex-shrink: 0; border-left: 1px solid #e5e7eb; padding-left: 10px; }
    .spec-val { font-weight: 900; color: inherit; outline: none; text-align: right; flex-grow: 1; padding-right: 10px; }
    
    .table-col-resizer { position: absolute; top: 0; bottom: 0; width: 8px; margin-right: -4px; cursor: col-resize; z-index: 10; background: transparent; transition: background 0.2s; }
    .table-col-resizer:hover, .table-col-resizer:active { background: rgba(245, 183, 0, 0.6); }

    /* Containers */
    .free-container { position: absolute; border: 1px dashed #ccc; background: rgba(248, 249, 250, 0.9); display: flex; flex-direction: column; z-index: 5; }
    .free-container:hover { border-color: #f5b700; box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 10; }
    .drag-bar { height: 24px; background: #282c35; color: #f5b700; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; font-size: 11px; opacity: 0; transition: opacity 0.2s; flex-shrink: 0;}
    .free-container:hover .drag-bar { opacity: 1; }
    .drag-title { flex: 1; text-align: center; cursor: grab; }

    /* 8-Directional Resizers */
    .resizer { position: absolute; background: #fff; border: 1px solid #f5b700; opacity: 0; z-index: 20; box-shadow: 0 0 3px rgba(0,0,0,0.2); transition: opacity 0.2s; }
    .free-container:hover .resizer, .draggable-wrapper:hover .resizer { opacity: 1; }
    .resizer.t { top: -4px; left: 50%; width: 10px; height: 8px; transform: translateX(-50%); cursor: ns-resize; }
    .resizer.b { bottom: -4px; left: 50%; width: 10px; height: 8px; transform: translateX(-50%); cursor: ns-resize; }
    .resizer.l { left: -4px; top: 50%; width: 8px; height: 10px; transform: translateY(-50%); cursor: ew-resize; }
    .resizer.r { right: -4px; top: 50%; width: 8px; height: 10px; transform: translateY(-50%); cursor: ew-resize; }
    .resizer.tl { top: -4px; left: -4px; width: 8px; height: 8px; cursor: nwse-resize; }
    .resizer.tr { top: -4px; right: -4px; width: 8px; height: 8px; cursor: nesw-resize; }
    .resizer.bl { bottom: -4px; left: -4px; width: 8px; height: 8px; cursor: nesw-resize; }
    .resizer.br { bottom: -4px; right: -4px; width: 8px; height: 8px; cursor: nwse-resize; }

    .draggable-wrapper { position: absolute; z-index: 6; border: 2px solid transparent; min-height: 20px; min-width: 30px; }
    .draggable-wrapper:hover { border: 2px dashed #f5b700; z-index: 10; }
    .drag-handle { cursor: grab; display: inline-flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); color: white; border-radius: 4px; padding: 2px 5px; margin-left: 5px; opacity: 0; font-size: 16px; z-index: 100; }
    .draggable-wrapper:hover .drag-handle { opacity: 1; }

    /* Smart Toolbar */
    .text-toolbar { position: absolute; top: -38px; right: 50%; transform: translateX(50%); background: #ffffff; border: 1px solid #d1d5db; border-radius: 6px; display: flex; gap: 6px; padding: 4px 8px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 50; box-shadow: 0 4px 10px rgba(0,0,0,0.15); align-items: center; }
    .group:hover .text-toolbar { opacity: 1; pointer-events: auto; }
    .text-toolbar input[type="color"] { width: 22px; height: 22px; padding: 0; border: none; border-radius: 4px; cursor: pointer; }
    .text-toolbar input[type="number"] { width: 45px; text-align: center; font-size: 12px; font-weight: bold; color: black; border: 1px solid #ccc; border-radius: 3px; }
    .text-toolbar select { font-size: 12px; color: black; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; background: #f9fafb; outline: none; }
    .align-btn { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 11px; font-weight: bold; color: #374151; transition: all 0.2s; }
    .align-btn:hover { background: #f5b700; color: #000; border-color: #f5b700; }

    /* Snap Guides */
    .snap-guide-v { position: absolute; width: 1px; top: 0; bottom: 0; background-color: #ef4444; z-index: 9999; display: none; pointer-events: none; }
    .snap-guide-h { position: absolute; height: 1px; left: 0; right: 0; background-color: #ef4444; z-index: 9999; display: none; pointer-events: none; }

    a.contact-text, span.contact-text { text-decoration: none; outline: none; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #15171c; }
    ::-webkit-scrollbar-thumb { background: #f5b700; border-radius: 4px; }

    @media print {
      body { background: none; }
      .w-\[45\%\] { display: none !important; }
      .w-\[55\%\] { width: 100% !important; padding: 0 !important; background: none !important; overflow: visible !important; }
      .canvas-container { overflow: visible !important; height: auto !important; padding-bottom: 0 !important; }
      .a4-page { transform: scale(1) !important; margin: 0 !important; box-shadow: none !important; width: 210mm !important; height: 297mm !important; page-break-after: always; }
      .a4-page::before, .a4-page::after { display: none !important; }
      .drag-bar, .resizer, .col-resizer, .table-col-resizer, .drag-handle, .text-toolbar, .no-print, .delete-btn, .snap-guide-v, .snap-guide-h { display: none !important; }
      .free-container, .draggable-wrapper { border: none !important; background: transparent !important; }
    }
  </style>
</head>
<body class="h-screen flex overflow-hidden">

      <span id="dataStatus" class="text-xs bg-gray-700 text-white px-2 py-1 rounded">جاري الاتصال...</span>

    <!-- 0. إدارة القوالب -->

      <div class="flex gap-2 mt-2">
        <div class="w-1/2">
          <label class="block text-[10px] font-bold text-gray-400">الترويسة (Header):</label>
          <input type="file" id="globalHeader" accept="image/*" class="w-full text-[10px] text-gray-400 bg-[#181b22] rounded p-1 mt-1">

      </div>
    </div>

    <!-- محرك بناء القوالب -->
    <div class="bg-[#0e1014] p-3 rounded-lg border border-[#f5b700] flex flex-col gap-2 relative shadow-lg">
      <h2 class="text-white font-black text-sm border-b border-[#282c35] pb-2 text-center text-[#f5b700]">2. بناء القالب وتعبئة البيانات آلياً</h2>
      
      <!-- الخطوة 1 -->
      <label class="text-[11px] font-bold text-gray-300 mt-1 bg-[#1f2937] p-1 rounded text-center">الخطوة 1: تخطيط الصفحة (إدراج الحاويات الفارغة)</label>
      <div class="flex items-center gap-2 mt-1">

  <!-- مساحة العمل الحية -->

<script>
  // ==========================================
  // محرك الربط بقاعدة بيانات Google Sheets
  // ==========================================
  const SHEETS_ID = "1TDSSCDfAQJxz_zeulBrM6M79p9fw7mE1xTSvD-P_fuQ";
  let database = { skid_steers: [], pumps: [] };
  
  const translationDict = {

    'drive_type': 'نوع الدفع', 'travel_speed': 'سرعة السير', 'max_travel_speed': 'السرعة القصوى', 'gradeability': 'قدرة التسلق', 'tires': 'الإطارات', 'steering_type': 'نمط التوجيه',
    'rated_payload': 'الحمولة المقدرة', 'rated_load': 'الحمولة المقننة', 'bucket_capacity': 'سعة الدلو', 'dump_height': 'ارتفاع التفريغ', 'arm_length': 'طول الذراع', 'breakout_force': 'قوة الكسر', 'lifting_capacity': 'قدرة الرفع', 'performance_productivity': 'الإنتاجية', 'performance_pressure': 'الضغط', 'pump_vertical_fine': 'ضخ رأسي', 'pump_horizontal_fine': 'ضخ أفقي', 'max_aggregate_size': 'أقصى حجم للركام',

    'std_equip_1': 'تجهيز قياسي 1', 'std_equip_2': 'تجهيز قياسي 2', 'std_equip_3': 'تجهيز قياسي 3', 'opt_equip_1': 'تجهيز اختياري 1', 'feature_1': 'ميزة 1',

  const tableGroups = {

      'performance': ['rated_payload', 'rated_load', 'bucket_capacity', 'std_bucket_capacity', 'dump_height', 'arm_length', 'breakout_force', 'bucket_breakout_force', 'lifting_capacity', 'max_lifting_force', 'rollback_angle_ground', 'max_dump_angle', 'rear_departure_angle', 'front_approach_angle', 'performance_productivity', 'performance_pressure', 'pump_vertical_fine', 'pump_horizontal_fine', 'pump_vertical_coarse', 'pump_horizontal_coarse', 'max_aggregate_size', 'cooling_system_performance'],

  async function fetchSheetData() {
      const statusBadge = document.getElementById('dataStatus');
      try {
          const skidUrl = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/export?format=csv&gid=546876457`;
          const pumpUrl = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/export?format=csv&gid=1201691755`;
          await Promise.all([
            new Promise((resolve, reject) => Papa.parse(skidUrl, { download: true, header: true, complete: res => { database.skid_steers = res.data; resolve(); }, error: err => reject(err)})),
            new Promise((resolve, reject) => Papa.parse(pumpUrl, { download: true, header: true, complete: res => { database.pumps = res.data; resolve(); }, error: err => reject(err)}))
          ]);
          statusBadge.innerHTML = 'متصل بالبيانات 🟢';
          statusBadge.className = 'text-xs bg-green-700 text-white px-2 py-1 rounded';
          updateModelsList();
      } catch (error) {
          statusBadge.innerHTML = 'خطأ بالاتصال 🔴';
          statusBadge.className = 'text-xs bg-red-700 text-white px-2 py-1 rounded';
      }
  }

  function updateModelsList() {
      const category = document.getElementById('sheetCategory').value;
      const modelSelector = document.getElementById('modelSelector');
      modelSelector.innerHTML = '';
      const models = database[category];
      if(!models || models.length === 0) { modelSelector.innerHTML = '<option value="">لا يوجد موديلات</option>'; return; }
      models.forEach((row, index) => {
          if(row.model_name && row.model_name.trim() !== '') {
              const opt = document.createElement('option');
              opt.value = index; opt.text = row.model_name;
              modelSelector.appendChild(opt);
          }
      });
  }

  // ==========================================
  // الصور والخلفيات (الترويسة والتذييل)
  // ==========================================
  let state = { headerImg: '', footerImg: '', lastFooterImg: '' };

  document.getElementById('globalHeader').addEventListener('change', (e) => uploadImage(e, 'headerImg'));
  document.getElementById('globalFooter').addEventListener('change', (e) => uploadImage(e, 'footerImg'));
  document.getElementById('lastFooter').addEventListener('change', (e) => uploadImage(e, 'lastFooterImg'));
  
  function uploadImage(event, stateKey) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) { 
        state[stateKey] = e.target.result; 
        updateHeadersAndFooters(); 
      }
      reader.readAsDataURL(file);
    }
  }

  function updateHeadersAndFooters() {
    document.querySelectorAll('.page-header').forEach(el => { 
        if(state.headerImg) el.style.backgroundImage = `url(${state.headerImg})`; 
    });
    document.querySelectorAll('.is-normal-footer').forEach(el => { 
        if(state.footerImg) el.style.backgroundImage = `url(${state.footerImg})`; 
    });
    document.querySelectorAll('.is-last-footer').forEach(el => {
        if(state.lastFooterImg) { 
            el.style.backgroundImage = `url(${state.lastFooterImg})`; 
        } else if (state.footerImg) { 
            el.style.backgroundImage = `url(${state.footerImg})`; 
        }
    });
  }

  // ==========================================
  // الأساسيات (التحريك والتحجيم المستقر جداً)
  // ==========================================
  const scale = 0.65;
  const mmToPx = 3.7795275591;
  const marginPx = 5 * mmToPx;

  function attachResizers(element, targetPage) {
    const handlePositions = ['t', 'b', 'l', 'r', 'tl', 'tr', 'bl', 'br'];
    handlePositions.forEach(pos => {
      const handle = document.createElement('div'); 
      handle.className = `resizer ${pos}`; 
      element.appendChild(handle);
    });
    makeBoundedBoxResizable(element, targetPage);
  }

  function makeBoundedDraggable(element, handle, page) {
    let isDragging = false, startX, startY, initialLeft, initialTop;
    let vGuide, hGuide;

    handle.addEventListener('mousedown', function(e) {
      if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; 
      e.preventDefault(); e.stopPropagation(); isDragging = true; 
      startX = e.clientX; startY = e.clientY;
      initialLeft = element.offsetLeft; initialTop = element.offsetTop;
      
      vGuide = page.querySelector('.snap-guide-v');
      if(!vGuide) { vGuide = document.createElement('div'); vGuide.className = 'snap-guide-v'; page.appendChild(vGuide); }
      hGuide = page.querySelector('.snap-guide-h');
      if(!hGuide) { hGuide = document.createElement('div'); hGuide.className = 'snap-guide-h'; page.appendChild(hGuide); }

      document.addEventListener('mousemove', drag); document.addEventListener('mouseup', dragEnd);
    });

    function drag(e) {
      if (!isDragging) return;
      const dx = (e.clientX - startX) / scale; const dy = (e.clientY - startY) / scale;
      let newLeft = initialLeft + dx; let newTop = initialTop + dy;
      
      const maxLeft = page.clientWidth - marginPx - element.offsetWidth;
      const maxTop = page.clientHeight - marginPx - element.offsetHeight;
      newLeft = Math.max(marginPx, Math.min(newLeft, maxLeft));
      newTop = Math.max(marginPx, Math.min(newTop, maxTop));

      let snappedX = false, snappedY = false;
      const snapThreshold = 5; 
      const rect = { left: newLeft, right: newLeft + element.offsetWidth, top: newTop, bottom: newTop + element.offsetHeight, centerX: newLeft + element.offsetWidth/2, centerY: newTop + element.offsetHeight/2 };

      if(vGuide) vGuide.style.display = 'none'; 
      if(hGuide) hGuide.style.display = 'none';

      const pageCenterX = page.clientWidth / 2;
      if(Math.abs(rect.centerX - pageCenterX) < snapThreshold) { 
          newLeft = pageCenterX - element.offsetWidth/2; 
          if(vGuide) { vGuide.style.left = `${pageCenterX}px`; vGuide.style.display = 'block'; }
          snappedX = true; 
      }

      const siblings = Array.from(page.querySelectorAll('.draggable-wrapper, .free-container')).filter(el => el !== element);
      for(let sibling of siblings) {
          const sLeft = sibling.offsetLeft, sTop = sibling.offsetTop, sRight = sLeft + sibling.offsetWidth, sBottom = sTop + sibling.offsetHeight;
          const sCenterX = sLeft + sibling.offsetWidth/2, sCenterY = sTop + sibling.offsetHeight/2;
          
          if(!snappedX) {
              if(Math.abs(rect.left - sLeft) < snapThreshold) { newLeft = sLeft; if(vGuide){vGuide.style.left = `${sLeft}px`; vGuide.style.display = 'block';} snappedX = true; }
              else if(Math.abs(rect.right - sRight) < snapThreshold) { newLeft = sRight - element.offsetWidth; if(vGuide){vGuide.style.left = `${sRight}px`; vGuide.style.display = 'block';} snappedX = true; }
              else if(Math.abs(rect.centerX - sCenterX) < snapThreshold) { newLeft = sCenterX - element.offsetWidth/2; if(vGuide){vGuide.style.left = `${sCenterX}px`; vGuide.style.display = 'block';} snappedX = true; }
          }
          if(!snappedY) {
              if(Math.abs(rect.top - sTop) < snapThreshold) { newTop = sTop; if(hGuide){hGuide.style.top = `${sTop}px`; hGuide.style.display = 'block';} snappedY = true; }
              else if(Math.abs(rect.bottom - sBottom) < snapThreshold) { newTop = sBottom - element.offsetHeight; if(hGuide){hGuide.style.top = `${sBottom}px`; hGuide.style.display = 'block';} snappedY = true; }
              else if(Math.abs(rect.centerY - sCenterY) < snapThreshold) { newTop = sCenterY - element.offsetHeight/2; if(hGuide){hGuide.style.top = `${sCenterY}px`; hGuide.style.display = 'block';} snappedY = true; }
          }
      }

      element.style.left = `${newLeft}px`; element.style.top = `${newTop}px`;
    }

    function dragEnd() { 
        isDragging = false; 
        if(vGuide) vGuide.style.display = 'none'; 
        if(hGuide) hGuide.style.display = 'none'; 
        document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', dragEnd); 
    }
  }

  function makeBoundedBoxResizable(element, page) {
    const resizers = element.querySelectorAll('.resizer');
    resizers.forEach(resizer => {
      resizer.addEventListener('mousedown', function(e) {
        e.preventDefault(); e.stopPropagation();
        let isResizing = true, startX = e.clientX, startY = e.clientY, startW = element.offsetWidth, startH = element.offsetHeight, startLeft = element.offsetLeft, startTop = element.offsetTop;
        
        function resize(e) {
          if (!isResizing) return;
          let dx = (e.clientX - startX) / scale; let dy = (e.clientY - startY) / scale;
          
          if (resizer.classList.contains('r') || resizer.classList.contains('tr') || resizer.classList.contains('br')) {
            const maxW = page.clientWidth - marginPx - startLeft; element.style.width = Math.min(maxW, Math.max(30, startW + dx)) + 'px';
          }
          if (resizer.classList.contains('l') || resizer.classList.contains('tl') || resizer.classList.contains('bl')) {
            let newLeft = startLeft + dx;
            if (newLeft < marginPx) { const diff = marginPx - newLeft; newLeft = marginPx; dx += diff; }
            const newWidth = startW - dx;
            if (newWidth > 30) { element.style.width = newWidth + 'px'; element.style.left = newLeft + 'px'; }
          }
          if (resizer.classList.contains('b') || resizer.classList.contains('bl') || resizer.classList.contains('br')) { 
            const maxH = page.clientHeight - marginPx - startTop;
            element.style.height = Math.min(maxH, Math.max(20, startH + dy)) + 'px'; 
          }
          if (resizer.classList.contains('t') || resizer.classList.contains('tl') || resizer.classList.contains('tr')) {
            let newTop = startTop + dy;
            if (newTop < marginPx) { const diff = marginPx - newTop; newTop = marginPx; dy += diff; }
            const newHeight = startH - dy;
            if (newHeight > 20) { element.style.height = newHeight + 'px'; element.style.top = newTop + 'px'; }
          }
        }
        function stopResize() { isResizing = false; document.removeEventListener('mousemove', resize); document.removeEventListener('mouseup', stopResize); }
        document.addEventListener('mousemove', resize); document.addEventListener('mouseup', stopResize);
      });
    });
  }

  function makeTableColResizable(resizer, block) {
      let isResizing = false;
      resizer.addEventListener('mousedown', function(e) { e.preventDefault(); e.stopPropagation(); isResizing = true; document.body.style.cursor = 'col-resize'; });
      document.addEventListener('mousemove', function(e) {
          if (!isResizing) return;
          const blockRect = block.getBoundingClientRect(); const mouseXFromRight = blockRect.right - e.clientX; const pctRight = (mouseXFromRight / blockRect.width) * 100;
          if (pctRight > 15 && pctRight < 85) { block.style.setProperty('--key-width', `${pctRight}%`); resizer.style.right = `${pctRight}%`; resizer.style.left = 'auto'; }
      });
      document.addEventListener('mouseup', function() { if (isResizing) { isResizing = false; document.body.style.cursor = 'default'; } });
  }

  // ==========================================
  // إدارة النظام والقوالب وإعدادات الصفحة
  // ==========================================
  function saveTemplate() {
    const pagesHTML = document.getElementById('pagesContainer').innerHTML;
    const templateData = { 
        pages: pagesHTML, state: state,
        pageCount: document.getElementById('pageCount').value, hasCover: document.getElementById('hasCover').checked
    };
    localStorage.setItem('scor_master_template_v9', JSON.stringify(templateData));
    alert('تم حفظ ترتيب وتنسيق الصفحات كقالب بنجاح!');
  }

  function loadTemplate() {
    const dataStr = localStorage.getItem('scor_master_template_v9');
    if(!dataStr) { alert('لا يوجد قالب محفوظ مسبقاً!'); return; }
    const templateData = JSON.parse(dataStr);
    
    document.getElementById('pageCount').value = templateData.pageCount;
    document.getElementById('hasCover').checked = templateData.hasCover;
    state = templateData.state || { headerImg: '', footerImg: '', lastFooterImg: '' };
    
    document.getElementById('pagesContainer').innerHTML = templateData.pages;
    
    updateHeadersAndFooters();
    
    document.querySelectorAll('.draggable-wrapper').forEach(wrapper => {
        const dragHandle = wrapper.querySelector('.drag-handle');
        const targetPage = wrapper.closest('.a4-page');
        if(dragHandle && targetPage) makeBoundedDraggable(wrapper, dragHandle, targetPage);
        attachResizers(wrapper, targetPage);
    });

    document.querySelectorAll('.free-container').forEach(container => {
        const dragBar = container.querySelector('.drag-bar');
        const targetPage = container.closest('.a4-page');
        if(dragBar && targetPage) makeBoundedDraggable(container, dragBar, targetPage);
        attachResizers(container, targetPage);

        const block = container.querySelector('.spec-block');
        const colResizer = container.querySelector('.table-col-resizer');
        if(block && colResizer) makeTableColResizable(colResizer, block);
    });
    
    alert('تم استرجاع القالب بنجاح!');
  }

  function renderPages() {
    const container = document.getElementById('pagesContainer');
    const targetSelect = document.getElementById('targetPageSelect');
    const hasCover = document.getElementById('hasCover').checked;
    const pageCount = parseInt(document.getElementById('pageCount').value) || 1;
    
    container.innerHTML = ''; targetSelect.innerHTML = '';
    if (hasCover) {
      container.appendChild(createPageElement('cover'));
      targetSelect.add(new Option('الغلاف', 'cover'));
    }
    for (let i = 1; i <= pageCount; i++) {
      const isLast = (i === pageCount);
      container.appendChild(createPageElement(i, isLast));
      targetSelect.add(new Option(`صفحة ${i}`, i));
    }
    
    updateHeadersAndFooters();
  }

  function createPageElement(pageNum, isLast = false) {
    const page = document.createElement('div');
    page.className = 'a4-page'; page.id = `page-${pageNum}`;
    const watermark = document.createElement('div'); watermark.className = 'no-print'; watermark.innerHTML = pageNum === 'cover' ? 'الغلاف' : `صفحة ${pageNum}`; watermark.style = "position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#e5e7eb; font-size:40px; font-weight:900; z-index:0; opacity: 0.2;";
    page.appendChild(watermark);
    if (pageNum !== 'cover') {
      const header = document.createElement('div'); header.className = 'page-header'; page.appendChild(header);
      const footer = document.createElement('div'); footer.className = isLast ? 'is-last-footer' : 'is-normal-footer'; page.appendChild(footer);
    }
    return page;
  }

  window.onload = function() { renderPages(); fetchSheetData(); };
