<style>

button,input,select,textarea{font:inherit}

#bc{padding:3px 10px;font-size:12px;background:#10121a;color:#9ca3af}
#tb button,#bc button{background:#282c35;color:#fff;border:0;border-radius:6px;min-width:34px;height:34px;padding:0 8px;cursor:pointer}

#tb button:hover{background:var(--ac);color:#000}

.lg{color:var(--ac);font-weight:900;margin-left:6px}

#tabs button.on{color:var(--ac);border-color:var(--ac)}

.hint{color:#6b7280;font-size:13px}

.sg button{background:var(--ac);color:#000;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:700;flex:none}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.gr button{background:#1f2937;color:#fff;border:1px solid #343946;border-radius:6px;padding:9px 4px;cursor:pointer;font-size:12px}
.gr button:hover{border-color:var(--ac);color:var(--ac)}
.f{display:block;margin:0 0 10px;font-size:12px;color:#9ca3af}.f span{display:block;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;background:#0e1014;border:1px solid #343946;color:#fff;border-radius:6px;padding:6px;font-size:13px}

.f button{background:#282c35;color:#fff;border:0;border-radius:6px;height:34px;width:34px;vertical-align:top;cursor:pointer}
#cv{overflow:auto;padding:16px 8px 120px;background:#181b22}
.pw{width:calc(793.7px*var(--s));height:calc(1122.5px*var(--s));margin:38px auto 14px;position:relative}
.pg{position:absolute;left:0;top:0;width:210mm;height:297mm;background:#fff center/cover;color:#000;overflow:hidden;transform:scale(var(--s));transform-origin:0 0;font-family:var(--ff);font-size:var(--fs);box-shadow:0 12px 36px #0008}
.pg.over::after{content:'⚠ المحتوى يتجاوز الصفحة';position:absolute;top:2mm;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:2px 12px;border-radius:99px;font-size:12px;z-index:9}
.hd,.ft{position:absolute;left:0;width:100%;background:center/100% auto no-repeat;pointer-events:none}
.hd{top:0;height:35mm}.ft{bottom:0;height:25mm;background-position:bottom}.ft.l{height:80mm}
.ct{position:absolute;left:8mm;right:8mm;overflow:hidden;display:flex;flex-direction:column}
.ct:empty::before{content:'الصفحة فارغة — أضف قسماً من تبويب «إضافة»';color:#bbb;padding:20mm;text-align:center}
.sc{display:flex;flex:none}.cl{display:flex;flex-direction:column;min-width:0}.w{cursor:pointer}
.sc:hover{outline:1px dashed #f5b70088}.cl:hover{outline:1px dashed #38bdf8aa}.w:hover{outline:1px dashed #f5b700}
.sel{outline:2px solid var(--ac)!important;outline-offset:-2px}
.fw{position:absolute;overflow:hidden;touch-action:none;z-index:5;cursor:move}
.hl{position:absolute;z-index:9;pointer-events:none;outline:2px solid var(--ac)}

.hl.in .tbr{bottom:auto;top:6px;margin:0}.hl.in.al .tbr{transform-origin:0 0}.hl.in.ar .tbr{transform-origin:100% 0}

.tbr b{background:var(--ac);color:#000;cursor:grab;touch-action:none}.tbr button:hover{background:var(--ac);color:#000}
.pb2{position:absolute;top:-32px;left:0;right:0;display:flex;gap:4px;align-items:center;justify-content:center;font-size:12px;color:#9ca3af}
.pb2 button{background:#282c35;color:#fff;border:0;border-radius:6px;min-width:30px;height:26px;cursor:pointer}.pb2 button:hover{background:var(--ac);color:#000}
[data-r=tl],[data-r=br]{cursor:nwse-resize}[data-r=tr],[data-r=bl]{cursor:nesw-resize}[data-r=t],[data-r=b]{cursor:ns-resize}[data-r=l],[data-r=r]{cursor:ew-resize}
[contenteditable]{outline:none;cursor:text}
.ph{border:2px dashed #ccc;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:13px}
.tbx{background:#f8f9fa;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden}
.th{position:relative;background:#1f2937;color:#fff;padding:8px 15px 8px 50px;font-weight:900;clip-path:polygon(15px 0,100% 0,100% 100%,0 100%)}
.th::after{content:'';position:absolute;inset:0 auto 0 0;width:40px;background:var(--pa);clip-path:polygon(15px 0,100% 0,calc(100% - 15px) 100%,0 100%)}

.tr{display:flex;justify-content:space-between;gap:8px;padding:5px 12px;border-bottom:1px solid #e5e7eb;background:#fff}.tr b:last-child{text-align:left}
.ctw{display:flex;gap:8px;justify-content:center;align-items:center;font-weight:700}.ctw a{text-decoration:none;color:inherit}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
@media(max-width:1100px){#app{grid-template-columns:260px 1fr}}
@media(max-width:720px){
#app{grid-template-columns:1fr}
#panel{position:fixed;left:0;right:0;bottom:0;height:56vh;z-index:20;transform:translateY(calc(100% - 46px));transition:transform .25s;border-radius:14px 14px 0 0;border:1px solid var(--l)}
#panel.open{transform:none}#cv{padding-bottom:80px}}
@page{margin:0}
@media print{
*{-webkit-print-color-adjust:exact;print-color-adjust:exact;outline:none!important}
html,body{height:auto;background:#fff}#app{display:block;height:auto}
#tb,#bc,#panel,#toast,.hl,.pb2{display:none!important}
#cv{overflow:visible;padding:0;background:none}
.pw{width:210mm;height:297mm;margin:0;break-after:page}.pw:last-child{break-after:auto}
.pg{transform:none;box-shadow:none}.pg.over::after,.ct:empty::before{content:none}.ph{visibility:hidden}}

<script>
